services:
  # ===================================================
  # Full-Stack Web Service (Backend + Frontend bundle)
  # ===================================================
  - type: web
    name: inventra-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
